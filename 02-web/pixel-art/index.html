<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>픽셀아트 그리기 🎨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎨 픽셀아트 그리기</h1>
  <p class="subtitle">색을 고르고, 격자를 클릭하거나 드래그해서 그려보세요!</p>

  <!-- 도구 모음 -->
  <div class="toolbar">
    <label>
      색상
      <input type="color" id="colorPicker" value="#ff5533" />
    </label>

    <label>
      격자 크기
      <select id="gridSize">
        <option value="8">8 × 8</option>
        <option value="16" selected>16 × 16</option>
        <option value="32">32 × 32</option>
      </select>
    </label>

    <button id="eraserBtn">🧽 지우개</button>
    <button id="clearBtn">🗑️ 전체 지우기</button>
    <button id="downloadBtn" class="primary">💾 PNG로 저장</button>
  </div>

  <!-- 그림판 (격자는 자바스크립트가 자동으로 만들어 줌) -->
  <div id="grid"></div>

  <p class="hint">💡 저장 버튼을 누르면 그림이 PNG 이미지 파일로 다운로드됩니다.</p>

  <script src="script.js"></script>
</body>
</html>
