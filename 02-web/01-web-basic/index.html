<!DOCTYPE html>
<!--
  2-1단계 — 화면의 "뼈대"
  ========================================
  HTML은 "무엇이 있는가"만 정합니다.
  꾸미기는 style.css, 동작은 script.js가 맡습니다.

  ★ 눈여겨볼 것: id="..." 속성
    JavaScript가 요소를 찾아올 때 쓰는 이름표입니다.
    이 파일의 id와 script.js의 getElementById가 짝입니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 도메인 어시스턴트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">

    <!-- ① 제목 — 각자 자기 도메인으로 바꿔보세요 -->
    <h1>🤖 내 도메인 어시스턴트</h1>
    <p class="subtitle">무엇이든 물어보세요.</p>

    <!-- ② 입력창 — 사용자가 글을 쓰는 곳 -->
    <textarea
      id="question"
      rows="4"
      placeholder="여기에 질문을 입력하세요"></textarea>

    <!-- ③ 버튼 — 누르면 script.js가 반응합니다 -->
    <button id="ask-button">물어보기</button>

    <!-- ④ 결과 영역 — 답이 채워질 빈 상자 -->
    <div id="result" class="result">결과가 여기에 표시됩니다.</div>

  </main>

  <!-- script는 항상 body 맨 끝에. 위 요소들이 먼저 만들어져야 찾을 수 있습니다. -->
  <script src="script.js"></script>

</body>
</html>
