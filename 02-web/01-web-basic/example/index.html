<!DOCTYPE html>
<!--
  2-1단계 완성본 — 채팅창의 "뼈대"
  ================================================================
  HTML은 "무엇이 있는가"만 정합니다.
    꾸미기는 style.css, 동작은 script.js가 맡습니다.

  ★ 이 파일에서 눈여겨볼 것 두 가지

    ① id="..." 속성
       JavaScript가 요소를 찾아올 때 쓰는 이름표입니다.
       이 파일의 id 와 script.js 의 getElementById 가 짝입니다.

    ② 아래 두 줄은 "나중에 추가된 줄"입니다
         <link rel="stylesheet" ...>  ← STEP 2에서 추가 (꾸미기 연결)
         <script src="script.js">     ← STEP 3에서 추가 (동작 연결)
       STEP 1에서는 이 두 줄이 없었고, 그래도 화면은 떴습니다.
       "HTML만으로도 페이지는 존재한다"가 STEP 1의 결론이었습니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 도메인 어시스턴트</title>

  <!-- STEP 2에서 추가된 줄 — 이 한 줄이 style.css를 데려옵니다 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="chat">

    <!-- ① 머리말 — 각자 자기 도메인으로 바꿔보세요 -->
    <header class="chat-header">
      <h1>🤖 내 도메인 어시스턴트</h1>
      <p class="subtitle">아직 AI는 없습니다. 서버가 규칙표대로 답합니다.</p>
    </header>

    <!-- ② 대화가 쌓이는 곳 — 처음엔 비어 있고, script.js가 채웁니다 -->
    <div id="messages" class="messages"></div>

    <!-- ③ 입력 영역
         <form>으로 감싼 이유: Enter 키로 보내기가 공짜로 따라옵니다.
         (form은 "제출"이라는 개념을 브라우저가 이미 알고 있습니다) -->
    <form id="chat-form" class="composer">
      <textarea
        id="input"
        rows="2"
        placeholder="메시지를 입력하세요  (Enter=보내기, Shift+Enter=줄바꿈)"></textarea>
      <button id="send" type="submit">보내기</button>
    </form>

  </main>

  <!-- STEP 3에서 추가된 줄
       ⚠️ 항상 body 맨 끝에 둡니다. 위 요소들이 먼저 만들어져야 찾을 수 있습니다. -->
  <script src="script.js"></script>

</body>
</html>
